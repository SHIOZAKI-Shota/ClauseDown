[package]
name = "clausedown-keychip"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
