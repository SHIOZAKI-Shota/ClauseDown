[package]
name = "clausedown-myna"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
myna-card = { version = "3.3", default-features = false, features = ["pcsc"] }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
zeroize = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
