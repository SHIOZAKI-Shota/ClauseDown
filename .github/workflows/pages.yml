name: 公式サイト

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - id: pages
              uses: actions/configure-pages@v5

            - name: マニュアルなどを HTML にする（Jekyll）
              uses: actions/jekyll-build-pages@v1
              with:
                  source: ./
                  destination: ./_site

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            - name: 部品を入れる
              run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

            - name: デモ（ブラウザーで動く編集画面）を作る
              run: npm run build:demo
              env:
                  CLAUSEDOWN_BASE: ${{ steps.pages.outputs.base_path }}/demo/

            - name: トップページとデモを足す
              run: |
                  sudo cp -r out/demo _site/demo
                  sudo cp site/index.html _site/index.html
                  sudo cp site/og.png _site/og.png

            - uses: actions/upload-pages-artifact@v3

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
